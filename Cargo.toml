# =============================================================================
#  R E P S   ·   ir-lang
# =============================================================================
[package]
name    = "ir-lang"
version = "2.0.0-alpha.3"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "SSA intermediate representation for native compilation: modules, calls, memory, exception edges, safepoints, SSA construction, statepoint insertion, a validator, a rewrite API, and a textual form."

# Keywords (5 max)
keywords = ["compiler", "ir", "ssa", "codegen", "lexersketch"]

# Categories
categories = ["development-tools", "compilers"]

# Links
homepage      = "https://github.com/jamesgober/ir-lang"
repository    = "https://github.com/jamesgober/ir-lang"
documentation = "https://docs.rs/ir-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "ir_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []
# The reference interpreter (OPS semantics oracle). Needs `std` for the IEEE
# float functions (sqrt, fma, rounding) that `core` does not provide on stable.
interp = ["std"]


# DEPENDENCIES
# #################################
# None: the IR, validator, printer, parser, SSA construction, statepoint
# insertion, `ls_pow`, and interpreter are self-contained.
[dependencies]


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# TESTS AND EXAMPLES THAT RUN THE INTERPRETER
# #################################
[[test]]
name              = "interp"
required-features = ["interp"]

[[test]]
name              = "differential"
required-features = ["interp"]

[[test]]
name              = "rewrite"
required-features = ["interp"]

[[example]]
name              = "run"
required-features = ["interp"]


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
